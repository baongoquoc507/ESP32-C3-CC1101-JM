; ESP-C3-Jammer - Jammer SubGHz doc lap cho ESP32-C3
; Khong WiFi / khong man hinh / khong nut bam - cam nguon la chay

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = no_ota.csv
lib_deps =
	lsatan/SmartRC-CC1101-Driver-Lib@2.5.7
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Wl,-z,muldefs
