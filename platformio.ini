; ESP-C3-DeauthDetector - Phat hien tan cong Deauth WiFi (ESP32-C3)
; Cam nguon -> phat WiFi AP, vao web xem mang xung quanh + canh bao deauth

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = no_ota.csv
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Wl,-z,muldefs
